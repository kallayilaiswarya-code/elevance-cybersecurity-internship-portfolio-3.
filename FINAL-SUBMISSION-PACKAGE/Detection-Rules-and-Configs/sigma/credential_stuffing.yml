title: Repeated Failed Logins from One Source
id: 7c4f2a19-5d83-4b61-a920-6e8f3d1c5074
status: test
description: Detects individual failed logins that can contribute to a credential-stuffing pattern when correlated.
author: Aiswarya Kallayil Rajesh
date: 2026-10-13
logsource:
    category: authentication
    product: windows
detection:
    selection:
        EventID: 4625
    condition: selection
falsepositives:
    - Users entering incorrect passwords
    - Misconfigured services
    - Authorized password audits
level: medium
tags:
    - attack.credential-access
    - attack.t1110.004
---
# Correlation requirement for SIEM implementation:
# Group by source IP over a rolling 5-minute window.
# Trigger when there are at least 5 failed logins
# across at least 5 distinct usernames.
# Correlation and distinct-user counting must be implemented
# by the SIEM's supported aggregation or correlation feature.
