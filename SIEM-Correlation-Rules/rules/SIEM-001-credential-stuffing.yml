title: Credential Stuffing Detection
id: SIEM-001
severity: high
status: experimental
description: Detect a source IP producing at least five failed login events across at least five distinct usernames within five minutes.
log_source: Authentication logs
condition:
  event_type: login_failure
  group_by: source_ip
  window: 5 minutes
  minimum_failed_attempts: 5
  minimum_distinct_usernames: 5
false_positives:
  - Legitimate users behind shared networks
  - Misconfigured applications or automated test systems
response:
  - Review authentication logs and source reputation
  - Check for successful logins following the failures
  - Apply appropriate account protections if malicious activity is confirmed
