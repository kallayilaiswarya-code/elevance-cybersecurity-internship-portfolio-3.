# ElastAlert Rule: Credential Stuffing Detection
# Framework: ElastAlert 2 / Elasticsearch
# MITRE ATT&CK: T1110.004 (Credential Stuffing)
# Author: Aiswarya (ElevanceSkills Cybersecurity Intern)

name: "SIEM-001: Credential Stuffing - Multiple Accounts Single IP"
type: cardinality
index: winlogbeat-*

# Rolling detection window
timeframe:
  minutes: 5

# Cardinality aggregation parameters
cardinality_field: "user.name"
max_cardinality: 4  # Triggers when 5 or more unique usernames fail authentication
query_key: "source.ip"

# Match criteria: Windows Security Event ID 4625 (Failed Logon) or ECS event.outcome: failure
filter:
  - query:
      query_string:
        query: 'event.code: "4625" OR (event.category: "authentication" AND event.outcome: "failure")'

# Alerting actions
alert:
  - "debug"

alert_subject: "CRITICAL: Credential Stuffing Detected from Source IP: {0}"
alert_subject_args:
  - "source.ip"

alert_text_type: alert_text_only
alert_text: |
  ================================================================================
  [ALERT] HIGH FIDELITY SIEM DETECTION: CREDENTIAL STUFFING
  ================================================================================
  Source IP       : {0}
  Time Window     : 5 Minutes
  Unique Accounts : >= 5 Target Usernames Attempted
  MITRE ATT&CK    : T1110.004 (Credential Stuffing / Password Spray)
  Severity        : HIGH

  INVESTIGATION PLAYBOOK:
  1. Correlate source IP {0} against successful logins (Event 4624) within +15 mins.
  2. Identify targeted usernames and initiate forced password reset if compromised.
  3. Verify source IP reputation via threat intelligence (AbuseIPDB, VirusTotal).
  4. Implement IP-level rate limiting or perimeter firewall temporary drop.
  ================================================================================
alert_text_args:
  - "source.ip"
