title: Suspicious Long DNS Query
id: 3a9e2d71-6c45-4b8f-a123-9d7e5f0c2468
status: test
description: Flags DNS queries with unusually long query names for investigation.
author: Aiswarya Kallayil Rajesh
date: 2026-10-13
logsource:
    category: dns
    product: windows
detection:
    selection:
        QueryName|re: '^[^.]{20,}\..{1,}$'
    condition: selection
falsepositives:
    - Legitimate long subdomains
    - Service discovery and security software
level: medium
tags:
    - attack.command-and-control
    - attack.t1071.004
